<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlowKit — Wird umgebaut</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
        }
        .container { padding: 40px; max-width: 500px; }
        .logo {
            width: 64px; height: 64px;
            background: #2563eb;
            border-radius: 16px;
            display: flex; align-items: center; justify-content: center;
            color: white; font-weight: 700; font-size: 28px;
            margin: 0 auto 32px;
        }
        h1 { font-size: 32px; font-weight: 800; margin-bottom: 16px; color: white; }
        p { font-size: 18px; color: #94a3b8; line-height: 1.6; margin-bottom: 32px; }
        .badge {
            display: inline-block;
            padding: 8px 20px;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 20px;
            font-size: 14px;
            color: #64748b;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">FK</div>
        <h1>Wird umgebaut</h1>
        <p>FlowKit bekommt ein Upgrade.<br>Bald wieder mit neuer Power.</p>
        <span class="badge">Coming Soon</span>
    </div>
</body>
</html>
